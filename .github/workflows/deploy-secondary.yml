name: Deploy to Secondary Domain

on:
  push:
    branches: [ production, release ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Create .htaccess file
      run: |
        cat > dist/.htaccess << 'EOF'
        Options +FollowSymLinks
        RewriteEngine On
        RewriteRule ^[Cc]omingsoon/?$ /index.html [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
        EOF
        
    - name: Deploy to Secondary Domain via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER_SECONDARY }}
        username: ${{ secrets.FTP_USERNAME_SECONDARY }}
        password: ${{ secrets.FTP_PASSWORD_SECONDARY }}
        local-dir: ./dist/
        server-dir: ./
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
        state-name: .ftp-deploy-sync-state-secondary.json
        dry-run: false
