name: Deploy via SSH

on:
  push:
    branches: [ main, pranav ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Create .htaccess file
      run: |
        cat > dist/.htaccess << 'EOF'
        Options +FollowSymLinks
        RewriteEngine On
        RewriteRule ^[Cc]omingsoon/?$ /index.html [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
        EOF
        
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          # Backup current deployment
          if [ -d "/path/to/your/website" ]; then
            cp -r /path/to/your/website /path/to/backup/$(date +%Y%m%d_%H%M%S)
          fi
          
          # Create deployment directory if it doesn't exist
          mkdir -p /path/to/your/website
          
    - name: Copy files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        source: "dist/*"
        target: "/path/to/your/website/"
        strip_components: 1